[[bin]]
bench = false
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.65"
cargo-lock = "8.0.2"
chrono = "0.4.22"
clap = { version = "4.0.18", features = ["derive"] }
indexmap = { workspace = true }
inquire = { version = "0.5.1" }
num-format = "0.4.4"
owo-colors = "3"
plotters = { version = "0.3.4", features = ["full_palette"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.85"
tabled = { version = "0.10.0", features = ["color"] }
walkdir = "2.3.2"

[lints]
workspace = true

[package]
description = "https://github.com/matklad/cargo-xtask/"
edition = "2021"
license-file = "LICENSE"
name = "xtask"
publish = false
version = "0.1.0"
