[dependencies]
libc = "0.2.40"
log = "0.4.1"
thiserror = { workspace = true }

[dev-dependencies]
rand = "0.8.2"
tempfile = { workspace = true }

[features]
default = ["strict"]
strict = []          # Warnings are errors

[lib]
path = "Source/lib.rs"

[lints]
workspace = true

[package]
authors = ["Paul Hummer <paul@eventuallyanyway.com>"]
categories = ["filesystem"]
description = "A library for using pidfiles as resource locks"
edition = "2024"
include = [
  "src/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]
keywords = ["pidfile", "file", "filelock", "server", "lock"]
license = "MIT"
name = "pidlock"
readme = "README.md"
repository = "https://github.com/rockstar/pidlock"
version = "0.1.4"

[target]

[target."cfg(windows)"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.45.0", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
] }
