[package]
name = "turborepo-napi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
either = { workspace = true }
napi = { version = "2.14.0", features = ["tokio_rt"] }
napi-derive = "2.14.0"
thiserror = { workspace = true }
tokio = { workspace = true }
turbopath = { workspace = true }
turborepo-repository = { workspace = true }
turborepo-scm = { workspace = true }
tracing = "0.1.37"

[dev-dependencies]
pretty_assertions = { workspace = true }

[features]
noop = ["napi-derive/noop"]

[lib]
crate-type = ["cdylib"]
path = "Source/lib.rs"

[lints]
workspace = true

[package]
edition = "2024"
license-file = "LICENSE"
name = "turborepo-napi"
version = "0.1.0"
